name: Build, Push, and Deploy Cope

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: cope
  EXPRESS_SERVICE_ARN: arn:aws:ecs:us-west-2:299113402161:service/default/cope-7c1f

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.COPE_AWS_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy Cope to ECS Express Mode
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Deploying image: $IMAGE_URI"
          echo "Express service: $EXPRESS_SERVICE_ARN"

          aws ecs update-express-gateway-service \
            --region "$AWS_REGION" \
            --service-arn "$EXPRESS_SERVICE_ARN" \
            --primary-container "image=$IMAGE_URI,containerPort=8080" \
            --monitor-resources

          echo "Cope Express Mode deployment started."
